[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "meteo-parapente-arome"
version = "0.1.0"
description = "Backend : profil vertical AROME 0.025° (Open-Meteo) pour un point GPS."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Licence Ouverte 2.0 — données Météo-France" }
authors = [{ name = "meteo-parapente" }]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "httpx>=0.27.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "python-dotenv>=1.0.0",
    "xarray>=2024.1.0",
    "cfgrib>=0.9.14",
    "eccodes>=2.37.0",
    "numpy>=1.26.0",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
]

[project.scripts]
arome-cli = "src.cli:main"

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
