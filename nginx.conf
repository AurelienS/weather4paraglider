server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # hashed assets are immutable, cache them for a year
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # never cache the shell so deploys go live immediately
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # SPA fallback: all state lives in the query string
    location / {
        try_files $uri $uri/ /index.html;
    }
}
