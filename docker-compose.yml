version: '3.8'

services:
  app:
    build: .
    restart: unless-stopped
    networks:
      - traefik_default
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.w4p.rule=Host(`meteo.codeas.me`)"
      - "traefik.http.routers.w4p.entrypoints=websecure"
      - "traefik.http.routers.w4p.tls.certresolver=letsencrypt"
      # the nginx base image already exposes 80: pin the backend port
      - "traefik.http.services.w4p.loadbalancer.server.port=8080"

networks:
  traefik_default:
    external: true
